name: Build TradeIt

on:
  push:
    branches: [ main, order1 ]
  pull_request:
    branches: [ main, order1 ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore TradeIt.csproj

      - name: Build
        run: dotnet build TradeIt.csproj --configuration Release --no-restore
