name: One-time MainWindow integration

on:
  push:
    branches: [order1]

permissions:
  contents: write

jobs:
  integrate:
    if: github.sha != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order1
          fetch-depth: 0
      - name: Integrate AutoScrollController into MainWindow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MainWindow.xaml.cs')
          s = p.read_text(encoding='utf-8-sig')

          start = s.index('        // =========================================================\n        // Auto Scroll\n        // =========================================================\n\n        private DispatcherTimer? _autoScrollTimer;')
          end = s.index('        // =========================================================\n        // Symbol Selection Control', start)
          s = s[:start] + s[end:]

          s = s.replace('StopAutoScroll();', 'StopAutoScrollController();')

          start = s.index('        // =========================================================\n        // Auto Scroll Button\n        // =========================================================')
          end = s.index('        // =========================================================\n        // Full Screen Button\n        // =========================================================', start)
          s = s[:start] + s[end:]

          old = '''        private void MainWindow_Closed(\n            object? sender,\n            EventArgs e)\n        {\n            StopAutoScrollController();\n        }'''
          new = '''        private void MainWindow_Closed(\n            object? sender,\n            EventArgs e)\n        {\n            StopAutoScrollController();\n            _autoScrollController.Dispose();\n        }'''
          if old not in s:
              raise SystemExit('Expected MainWindow_Closed block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit integration
        shell: bash
        run: |
          rm -f .github/workflows/one-time-integrate-mainwindow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainWindow.xaml.cs .github/workflows/one-time-integrate-mainwindow.yml
          if git diff --cached --quiet; then
            echo "No integration changes required."
            exit 0
          fi
          git commit -m "Complete MainWindow Auto Scroll integration"
          git push origin HEAD:order1
